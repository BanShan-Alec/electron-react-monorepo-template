<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>renderer</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.app-startup-ready #root {
        opacity: 1;
      }

      /* 拖拽必须写在内联样式块：Tailwind content 仅扫描 ./src/**，
         任意属性类 [app-region:drag] 在本文件中不会生成产物 */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
        -webkit-app-region: drag;
      }

      body.app-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.25),
          0 8px 10px -6px rgb(0 0 0 / 0.25);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: '';
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .startup-logo-slot {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }
        38% {
          opacity: 1;
          transform: scale(1.045);
        }
        58% {
          transform: scale(0.985);
        }
        76% {
          transform: scale(1.008);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading" role="status" aria-busy="true" aria-label="Loading...">
      <div class="startup-logo-shell">
        <div class="startup-logo-slot">
          <!-- __APP_STARTUP_LOGO__ -->
        </div>
      </div>
    </div>
    <!-- __APP_STARTUP_COORDINATOR__ -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
