<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文档站离线</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #57606a;
        --border: #d0d7de;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #8b949e;
          --border: #30363d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 440px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 14px;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 96px;
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
      }

      button {
        border-color: var(--fg);
        background: var(--fg);
        color: var(--bg);
      }

      button:hover,
      a:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>文档站离线</h1>
      <p>这个页面还没有缓存。请联网后重新打开一次；已经访问过的页面可以离线查看。</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">重试</button>
        <!-- 首页地址需与 packages/docs/src/navigation.ts 的 BASE_PATH 保持一致 -->
        <a href="/electron-react-monorepo-template/">返回首页</a>
      </div>
    </main>
  </body>
</html>
