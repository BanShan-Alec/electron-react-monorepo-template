# PR 标题校验,规则与 .config/commitlint.config.ts 保持一致:
# squash 合并后 PR 标题即 main 上的提交信息,changelogen 生成 changelog 依赖其规范性。
name: Semantic PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    name: semantic-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          subjectPattern: '[\u4e00-\u9fa5]'
          subjectPatternError: |
            PR 标题的说明部分需包含中文描述,例如: feat(window): 接入 WCO 原生标题栏
