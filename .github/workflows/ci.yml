# PR / main 分支门禁:类型检查、代码规范、单元测试、Electron e2e、文档站构建。
# 五个 job 并行,均为分支保护的 required checks。
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm run lint
      - run: pnpm run verify:prebuild

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm run test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      # Electron 42+ 改为首次运行时惰性下载二进制；只下载不启动，规避 Linux sandbox 限制
      - run: pnpm exec install-electron
      # electron.launch 以 package.json main 为入口,需要先产出各包的构建产物
      - run: pnpm run build
      - run: pnpm run test:e2e

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      # 文档站门禁:vocs full-static 构建成功即通过(死链/格式问题在此暴露)
      - run: pnpm --filter @app/docs run build
