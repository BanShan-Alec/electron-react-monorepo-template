# AI code review on pull requests, powered by alibaba/open-code-review.
# The LLM API config below is intentionally left blank:
# fill in llm_url / llm_auth_token / llm_model before the review can actually run.
name: OpenCodeReview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: OpenCodeReview PR Review
        uses: alibaba/open-code-review@v1.12.11
        with:
          # ===== LLM API 配置(留空,待填写)=====
          # OpenAI 兼容端点,如 https://api.openai.com/v1
          llm_url: ${{ secrets.OCR_LLM_URL }}
          # 认证令牌;建议放入仓库 Secrets 后改为 ${{ secrets.OCR_LLM_TOKEN }}
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          # 模型名,如 gpt-4o / qwen-max / claude-sonnet-4-5
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          # 协议:留空 = OpenAI 兼容;填 true = Anthropic 协议
          llm_use_anthropic: ''
          # ===== 输出配置 =====
          language: 'Chinese'
